name: Publish Assist Roofing Website

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Checks
        run: npx tsc -b

      - name: Build and Pre-render
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          node server/sync-public-data.js
          npx vite build
          node server/sync-public-data.js --prerender
        
      - name: Validate Output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory does not exist."
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html does not exist."
            exit 1
          fi
          if [ ! -f "dist/data/cms-content.json" ]; then
            echo "Error: dist/data/cms-content.json does not exist."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          channelId: live
          projectId: project-1-c8b7e

      - name: Deploy Firebase Security Rules
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
            npx firebase-tools deploy --only firestore:rules,storage --project project-1-c8b7e || echo "Rules deploy skipped or requires permissions."
            rm -f /tmp/sa.json
          fi
